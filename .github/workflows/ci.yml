name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting, vet and lint read nothing the tests need and are independent
  # of the Go version under test, so they run once on their own rather than
  # repeating across the matrix below.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Lint
        run: |
          go run github.com/mgechev/revive@v1.13.0 \
            -set_exit_status -config .revive.toml ./...

      # revive reads the syntax tree; staticcheck follows the values through
      # it. Pinned, since a new release finding new things would fail a build
      # that changed nothing.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26', 'stable']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: test
        run: go test -race ./...

  # govulncheck matches the module graph against the Go vulnerability database
  # and reports only advisories the code actually reaches, so an unreachable
  # one in a transitive module does not fail the build.
  #
  # Pinned like the linters above, but for a different reason: the database is
  # fetched at run time, so a pinned binary still sees new advisories. What the
  # pin avoids is a tool release changing what counts as reachable.
  #
  # Standard-library advisories depend on the toolchain running the scan, so it
  # runs on go.mod's version, the oldest one consumers can build with.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
