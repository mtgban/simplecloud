name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting, vet and lint read nothing the tests need, so they run as their
  # own job, in parallel with the tests.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Lint
        run: |
          go run github.com/mgechev/revive@v1.13.0 \
            -set_exit_status -config .revive.toml ./...

      # revive reads the syntax tree; staticcheck follows the values through
      # it. Pinned, since a new release finding new things would fail a build
      # that changed nothing.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: test
        run: go test -race ./...

  # govulncheck matches the module graph against the Go vulnerability database
  # and reports only advisories the code actually reaches, so an unreachable
  # one in a transitive module does not fail the build.
  #
  # Pinned like the linters above, but for a different reason: the database is
  # fetched at run time, so a pinned binary still sees new advisories. What the
  # pin avoids is a tool release changing what counts as reachable.
  #
  # Standard-library advisories depend on the toolchain running the scan. This
  # one runs on go.mod's toolchain line, like the other jobs; consumers build
  # with their own toolchain, so the standard library's patch level is theirs.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
