# Style rules the tree already satisfies, so that a regression is caught at
# review time rather than found in a later sweep. The rule set is the one
# github.com/mtgban/go-mtgban runs; only the unhandled-error exemptions below
# are specific to this package.

ignoreGeneratedHeader = false
severity = "error"
confidence = 0.8
errorCode = 1
warningCode = 1

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.dot-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
[rule.exported]
[rule.errorf]
[rule.increment-decrement]
[rule.indent-error-flow]
[rule.package-comments]
[rule.range]
[rule.receiver-naming]
[rule.redefines-builtin-id]
[rule.superfluous-else]
[rule.time-naming]
[rule.unexported-return]
[rule.unnecessary-format]
[rule.unchecked-type-assertion]
[rule.use-any]
[rule.use-waitgroup-go]
[rule.use-errors-new]
# The pipe methods are documented to always return nil, so there is no error
# to handle: io/pipe.go says so outright for both CloseWithError methods, and
# PipeWriter.Close is a call straight through to CloseWithError(nil). The
# Close families and io.Copy cover the abandon paths - a stream closed, or a
# failed response body drained so its connection can be reused, because the
# operation around it already failed, where the result cannot change what the
# caller is told. io.Copy is only exempt where its result is discarded
# outright; the transfer in Copy assigns both values and still checks them.
# io.WriteString is the same family as io.Writer.Write, which go-mtgban's own
# config exempts: it is the tests filling a temp file or an httptest response
# body, where a short write surfaces as the assertion that follows failing,
# and where a handler goroutine could not call t.Fatal anyway.
# Naming these keeps a real unhandled error from being lost among ones that
# are not; note that Copy's abort is deliberately NOT exempt, since a failed
# abort can strand a multipart upload.
[rule.unhandled-error]
  arguments = ["io.PipeWriter.Close", "io.PipeWriter.CloseWithError", "io.PipeReader.CloseWithError", "io.Closer.Close", "os.File.Close", "io.Copy", "io.WriteString"]
[rule.unreachable-code]
[rule.var-declaration]
[rule.var-naming]
